name: Emulator smoke test

# Runs the app on an Android emulator and walks through its main screens. It is slower than the
# regular CI, so it runs on demand: from the Actions tab, or for pushes whose commit message
# contains "[emulator]".
on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: bash .github/scripts/smoke-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-screens
          path: smoke/
          if-no-files-found: ignore
