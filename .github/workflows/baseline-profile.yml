name: Baseline profile

# Generates the Baseline Profile on an Android emulator and compares cold starts with and without
# it. The profile then has to be committed: take it from the artifact, or from the log, where it is
# printed gzipped and base64 encoded. Runs on demand from the Actions tab, or for pushes whose commit
# message contains "[profile]".
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  baseline-profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[profile]')
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the app and the generator
        # Built before the emulator starts, so that it does not wait for the compiler.
        run: >-
          ./gradlew :app:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease
          :baselineprofile:assembleBenchmarkRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate the profile and measure cold starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The profile should cover the moving decorations too.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: bash .github/scripts/baseline-profile.sh

      - name: Upload the profile and the timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            app/src/release/generated/baselineProfiles/
            baselineprofile/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
