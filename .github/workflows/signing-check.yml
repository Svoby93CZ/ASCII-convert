name: Signing check (temporary)

# One-off check of the Google Play bundle setup with a throwaway key. Removed once it passes.
on:
  push:
    branches: [ 'claude/**' ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the upload key step of Android CI with a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias ascii-studio -keyalg RSA -keysize 2048 \
            -validity 2 -storepass throwaway-pass -dname "CN=Throwaway signing check" -noprompt
          yq -r '.jobs.build.steps[] | select(.name == "Set up the upload key") | .run' .github/workflows/android.yml \
            > "$RUNNER_TEMP/setup-key.sh"
          cat "$RUNNER_TEMP/setup-key.sh"
          UPLOAD_KEYSTORE_BASE64="$(base64 -w 76 "$RUNNER_TEMP/throwaway.jks")" bash -e "$RUNNER_TEMP/setup-key.sh"
          cmp "$RUNNER_TEMP/throwaway.jks" "$RUNNER_TEMP/upload.jks"

      - name: Build the release APK and bundle like Android CI
        env:
          RELEASE_STORE_PASSWORD: throwaway-pass
          RELEASE_KEY_ALIAS: ascii-studio
          RELEASE_KEY_PASSWORD: ''
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionCode=4242 --stacktrace

      - name: Check the signer, version code and translations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"

          echo "== bundle signer"
          out=$(keytool -printcert -jarfile "$AAB")
          grep -E "Owner|SHA256" <<< "$out"
          grep -q "Owner: CN=Throwaway signing check" <<< "$out"

          echo "== APK signer"
          out=$("$BT/apksigner" verify --print-certs "$APK")
          grep -E "DN|SHA-256" <<< "$out"
          grep -q "CN=Throwaway signing check" <<< "$out"

          echo "== APK badging"
          out=$("$BT/aapt2" dump badging "$APK")
          grep -E "^(package|locales):" <<< "$out"
          grep -q "versionCode='4242'" <<< "$out"

          url=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".jar"))][0].browser_download_url')
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" "$url"
          echo "== bundle config ($url)"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle "$AAB"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle "$AAB" --output "$RUNNER_TEMP/app.apks" \
            --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass pass:throwaway-pass --ks-key-alias ascii-studio

          echo "== APKs that Google Play would install"
          out=$(unzip -l "$RUNNER_TEMP/app.apks")
          echo "$out"
          if grep -E "splits/base-[a-z]{2}\.apk" <<< "$out"; then
            echo "Language splits are still generated"
            exit 1
          fi
          unzip -o -q "$RUNNER_TEMP/app.apks" splits/base-master.apk -d "$RUNNER_TEMP/apks"
          echo "== base APK badging"
          out=$("$BT/aapt2" dump badging "$RUNNER_TEMP/apks/splits/base-master.apk")
          grep -E "^(package|locales):" <<< "$out"
          grep "^locales:" <<< "$out" | grep -q "'cs'"
