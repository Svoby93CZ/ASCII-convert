# Memory settings sized for an 8 GB development machine running Android Studio alongside Gradle.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Build features that this project does not use.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
